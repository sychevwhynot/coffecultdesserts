volumes:
  pg_data:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:16
    container_name: db
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  main:
    build: .
    container_name: main
    env_file: .env
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 main.wsgi:application"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build:
      context: ./nginx
    container_name: gateway
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - static_volume:/static
      - media_volume:/media
    depends_on:
      - main